events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    client_max_body_size 500M;

    server {
        # 1. Listen only on your custom HTTP port
        listen 18777;
        server_name ${NGINX_HOST} localhost;

        # 2. Serve subfolder media files straight from the volume data path
        location /media/ {
            alias /var/www/static/;
            expires 30d;
            access_log off;
        }

        # 3. Reverse Proxy directly to your internal backend api container
        location /api/ {
          proxy_pass http://cerohumano_server:8000;

          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 1. Point the root precisely to the flat directory folder
        root /usr/share/nginx/html;

        # 2. Universal fallback matching rule explicitly targeting the index file
        location / {
            try_files $uri /index.html;
        }

        # 3. Secure PWA Service Worker caching isolation parameters
        location /sw.js {
            try_files /sw.js =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
        }
    }
}
