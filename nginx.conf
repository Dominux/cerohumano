events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    client_max_body_size 500M;

    server {
        # 1. Listen only on your custom HTTP port
        listen 18777;
        server_name 192.168.50.70 localhost;

        # 2. Serve subfolder media files straight from the volume data path
        location /media/ {
            alias /var/www/static/;
            expires 30d;
            access_log off;
        }

        # 3. Reverse Proxy directly to your internal backend api container
        location /api/ {
          proxy_pass http://cerohumano_server:8000;

          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }


        # 4. Fallback root routing to serve your Svelte SPA frontend container
        location / {
            # Change this placeholder if your Svelte build folder is mounted elsewhere
            root /var/www/frontend/build;
            try_files $uri $uri/ /index.html;
        }
    }
}
